$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/jeffmhopkins/PoliticalResearch/templates/identity.schema.yaml"
title: Candidate identity anchor
type: object
required: [item_id, full_legal_name, ballot_name, office, photo_included]
additionalProperties: false
properties:
  item_id:
    type: string
  full_legal_name:
    type: string
  ballot_name:
    type: string
  office:
    type: string
  district:
    type: string
  city:
    type: string
  county:
    type: string
  state:
    type: string
  filing_ids:
    type: array
    items:
      type: string
  campaign_site:
    type: string
  occupation:
    type: string
  organizations:
    type: array
    items:
      type: string
  aliases:
    description: Publicly documented former, maiden, or filing names. Each entry names the source that recorded it.
    type: array
    items:
      type: object
      required: [name, source]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        source:
          type: string
          minLength: 1
        kind:
          type: string
          enum: [former, maiden, legal, also_known_as, filing, ballot]
  birth_year:
    description: Internal identity check only. Do not render this value, a date of birth, or an age derived only from it.
    type: integer
    minimum: 1800
    maximum: 2100
  description:
    type: string
  photo_included:
    type: boolean
    const: false
