$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/jeffmhopkins/PoliticalResearch/templates/profile.schema.yaml"
title: Structured candidate profile
description: Same issue keys, money report date, and field map for every candidate in a race.
type: object
additionalProperties: false
properties:
  item_id:
    type: string
  issues:
    type: object
    additionalProperties:
      type: string
  money:
    type: object
    additionalProperties: false
    properties:
      report_date:
        type: string
      receipts:
        type: string
      cash_on_hand:
        type: string
      self_funding:
        type: string
      small_donors:
        description: Share or amount from donors at or under the FEC $200 itemization threshold.
        type: string
      large_donors:
        description: Amount from individual donors above that same threshold.
        type: string
      in_district:
        description: In-district share when a filing supports it. Otherwise a not-found line. Do not guess from a ZIP.
        type: string
      pac_money:
        type: string
      party_money:
        type: string
      outside_spending:
        description: Independent expenditures for and against. Not money the campaign raised.
      donations_made:
        description: Donations the candidate personally made. Recipient, amount, and date only.
        type: array
        items:
          type: object
          required: [recipient, amount, date]
          additionalProperties: false
          properties:
            recipient:
              type: string
            amount:
              type: string
            date:
              type: string
            filing_url:
              type: string
  positions:
    type: array
    items:
      type: object
      required: [issue, statement, as_of]
      additionalProperties: false
      properties:
        issue:
          type: string
        statement:
          type: string
        as_of:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        source_url:
          type: string
        wayback_url:
          type: string
  legal_sweep:
    type: object
    additionalProperties: false
    required:
      - criminal
      - civil
      - financial
      - ethics_campaign_finance
      - professional_discipline
      - labor_consumer
      - misuse_of_office
      - prior_statements
    properties:
      aliases_searched:
        type: array
        items:
          type: string
      criminal:
        $ref: "#/$defs/legal_category"
      civil:
        $ref: "#/$defs/legal_category"
      financial:
        $ref: "#/$defs/legal_category"
      ethics_campaign_finance:
        $ref: "#/$defs/legal_category"
      professional_discipline:
        $ref: "#/$defs/legal_category"
      labor_consumer:
        $ref: "#/$defs/legal_category"
      misuse_of_office:
        $ref: "#/$defs/legal_category"
      prior_statements:
        $ref: "#/$defs/legal_category"
  gaps:
    type: array
    items:
      type: string
  fields:
    type: object
    additionalProperties: true
  party:
    description: Cited party field. Display text is neutral and includes the markers for the ballot label.
    type: object
    required: [race_nonpartisan, source_kind, display]
    additionalProperties: false
    properties:
      race_nonpartisan:
        type: boolean
      ballot_label:
        type: string
      registered_party:
        type: string
      source_kind:
        type: string
        enum: [ballot, elections_office, filing, voter_registration]
      registered_source_kind:
        type: string
        enum: [ballot, elections_office, filing, voter_registration]
      display:
        type: string
      changes_display:
        type: string
      changes:
        type: array
        items:
          type: object
          required: [from_party, to_party, date]
          additionalProperties: false
          properties:
            from_party:
              type: string
            to_party:
              type: string
            date:
              type: string
              pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
            source_url:
              type: string
  endorsements:
    description: The same endorsement records as the claims, so every candidate in the race is checked for the same fields.
    type: array
    items:
      type: object
      required: [endorser, endorser_type, date, source_role]
      additionalProperties: false
      properties:
        endorser:
          type: string
        endorser_type:
          type: string
          enum: [party, union, business_trade, advocacy, newspaper, elected_official]
        date:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        source_role:
          type: string
          enum: [endorser_statement, candidate_site]
        source_url:
          type: string
$defs:
  legal_category:
    type: object
    required: [status]
    additionalProperties: false
    properties:
      status:
        type: string
        enum: [checked_nothing_found, record_found, not_checked, portal_unavailable]
      note:
        type: string
