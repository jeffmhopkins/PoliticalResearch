$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/jeffmhopkins/PoliticalResearch/templates/claims.schema.yaml"
title: Claims file
type: object
required: [item_id, item_type, claims]
additionalProperties: false
properties:
  item_id:
    type: string
    pattern: "^[a-z0-9][a-z0-9-]*$"
  item_type:
    type: string
    enum: [candidate, race, measure, legislation, judicial-retention, primary, local-office]
  claims:
    type: array
    items:
      $ref: "#/$defs/claim"
$defs:
  source:
    type: object
    required: [url, publisher, title, doc_type, published, retrieved, tier, locator, quote, confidence]
    additionalProperties: false
    properties:
      url:
        type: string
        minLength: 8
      archive_url:
        type: [string, "null"]
      archive_failed:
        type: boolean
      archive_failed_reason:
        type: [string, "null"]
      publisher:
        type: string
        minLength: 1
      title:
        type: string
        minLength: 1
      doc_type:
        type: string
        minLength: 1
      published:
        type: string
        pattern: "^([0-9]{4}-[0-9]{2}-[0-9]{2}|undated)$"
      retrieved:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2} ET$"
      tier:
        type: string
        enum: [T1, T2, T3, T4]
      locator:
        type: string
        minLength: 1
      quote:
        type: string
        minLength: 1
        maxLength: 600
      confidence:
        type: string
        enum: [verified, single-source, unconfirmed]
      local_copy:
        type: string
      marker:
        type: integer
        minimum: 1
      suspected_injection:
        type: boolean
  claim:
    type: object
    required: [id, section, text, sources, confidence]
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]*(?:\\.[a-z0-9][a-z0-9-]*)+\\.[0-9]{3}$"
      section:
        type: string
        minLength: 1
      text:
        type: string
        minLength: 1
      marker:
        type: integer
        minimum: 1
      sources:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/source"
      confidence:
        type: string
        enum: [verified, single-source, unconfirmed, disputed, identity-unconfirmed]
      drives_summary:
        type: boolean
      polarity:
        type: string
        enum: [neutral, negative, positive]
      about_person:
        type: boolean
      identity_attributes:
        type: array
        items:
          type: string
      attribution_only:
        type: boolean
      as_of:
        type: string
      filing_period:
        type: string
      inputs:
        type: array
        items:
          type: string
      notes:
        type: string
      record_kind:
        type: string
        enum: [court, license_individual, license_entity, business, donation, position]
      court_caption:
        type: string
      record_date:
        type: string
        pattern: "^([0-9]{4}|[0-9]{4}-[0-9]{2}-[0-9]{2}|undated)$"
      legal_category:
        type: string
        enum:
          - criminal
          - civil
          - financial
          - ethics_campaign_finance
          - professional_discipline
          - labor_consumer
          - misuse_of_office
          - prior_statements
      legal_status:
        type: string
        enum:
          - allegation
          - allegation_only
          - lawsuit_filed
          - charge_or_indictment
          - settlement_without_admission
          - consent_decree
          - conviction_or_adjudicated_finding
          - convicted
          - pending
          - settled
          - dismissal
          - dismissed
          - acquittal
          - overturned_or_vacated
      accusation:
        type: string
      license_holder:
        type: string
        enum: [individual, entity]
      rhetoric_label:
        type: string
        enum: [MATCH, CONTRADICTION, NO RECORD]
      rhetoric_basis:
        type: string
        enum: [record, occupation, silence, statement]
      shift:
        type: boolean
      shift_from:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      shift_to:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      position_as_of:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      wayback_url:
        type: string
      wayback_local_copy:
        type: string
      removed:
        type: boolean
      removal_reason:
        type: string
      corrected:
        type: boolean
      correction_note:
        type: string
      promise_status:
        description: One platform item chosen by the fixed rule, rated on the shared scale. No other values.
        type: string
        enum: [kept, partially, not, no_record]
      endorsement:
        description: One cited endorsement. The source is the endorser's own statement or the candidate's site.
        type: object
        required: [endorser, endorser_type, date, source_role]
        additionalProperties: false
        properties:
          endorser:
            type: string
            minLength: 1
          endorser_type:
            type: string
            enum: [party, union, business_trade, advocacy, newspaper, elected_official]
          date:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          source_role:
            type: string
            enum: [endorser_statement, candidate_site]
      ballot_position:
        description: An organization officially supporting or opposing a measure, the sponsor committee, or a public top funder.
        type: object
        required: [role, organization]
        additionalProperties: false
        properties:
          role:
            type: string
            enum: [sponsor_committee, supporter, opponent, funder_for, funder_against]
          organization:
            type: string
            minLength: 1
          amount:
            type: string
